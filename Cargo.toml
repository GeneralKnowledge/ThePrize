[package]
name = "living-world"
version = "0.1.0"
edition = "2021"
description = "Headless prototype for The Living World simulation"
license = "MIT OR Apache-2.0"

[dependencies]
rand = "0.8"
rand_chacha = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }

[[bin]]
name = "living-world"
path = "src/main.rs"

[lib]
name = "living_world"
path = "src/lib.rs"
